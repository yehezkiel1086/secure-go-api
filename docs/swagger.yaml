basePath: /api/v1
definitions:
  github_com_yehezkiel1086_secure-go-api_internal_core_domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_yehezkiel1086_secure-go-api_internal_core_domain.LoginResponse:
    properties:
      tokens:
        $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.TokenPair'
      user:
        $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.UserResponse'
    type: object
  github_com_yehezkiel1086_secure-go-api_internal_core_domain.PaginatedUsersResponse:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
      users:
        items:
          $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.UserResponse'
        type: array
    type: object
  github_com_yehezkiel1086_secure-go-api_internal_core_domain.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  github_com_yehezkiel1086_secure-go-api_internal_core_domain.RegisterUserRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  github_com_yehezkiel1086_secure-go-api_internal_core_domain.TokenPair:
    properties:
      access_token:
        type: string
      access_token_expires_at:
        type: string
      refresh_token:
        type: string
      refresh_token_expires_at:
        type: string
    type: object
  github_com_yehezkiel1086_secure-go-api_internal_core_domain.UpdateUserNameRequest:
    properties:
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  github_com_yehezkiel1086_secure-go-api_internal_core_domain.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_email_verified:
        type: boolean
      name:
        type: string
      role:
        type: integer
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: A production-focused REST API written in Go, structured with Hexagonal
    Architecture (Ports and Adapters).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Secure Go API
  version: "1.0"
paths:
  /confirm-email:
    get:
      description: Verifies a user's email using a SHA-256 hashed verification token
        from query parameters
      parameters:
      - description: Email verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid or expired verification token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Confirm user email
      tags:
      - users
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials, sets hardened HttpOnly cookies,
        and returns JWT token pair
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.LoginResponse'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
  /logout:
    post:
      description: Revokes user refresh tokens and clears authentication cookies
      produces:
      - application/json
      responses:
        "200":
          description: Logged out successfully
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - auth
  /refresh:
    post:
      consumes:
      - application/json
      description: Rotates access and refresh tokens, detecting token reuse and setting
        new HttpOnly cookies
      parameters:
      - description: Optional refresh token body if cookies are not used
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.TokenPair'
        "400":
          description: Missing refresh token
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid, expired, or reused token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh token
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with hashed password and default User
        role (2001)
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.UserResponse'
        "400":
          description: Bad Request (e.g. validation failure)
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict (email already registered)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - users
  /users:
    get:
      description: Retrieves a paginated list of users ordered by creation date descending
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.PaginatedUsersResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List users
      tags:
      - users
  /users/{id}:
    get:
      description: Retrieves user details by their UUID primary key
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.UserResponse'
        "400":
          description: Invalid UUID format
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user by ID
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Updates the display name of a user identified by UUID
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      - description: Updated user display name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.UpdateUserNameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_yehezkiel1086_secure-go-api_internal_core_domain.UserResponse'
        "400":
          description: Invalid UUID or request body
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update user name
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
